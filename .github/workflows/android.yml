# 안드로이드 관리자 앱(APK) 빌드 → GitHub Release 로 올린다.
# 받는 주소: https://github.com/GeojeBow/pcbang-admin/releases/latest/download/pcbang-admin.apk
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare signing key
        working-directory: android
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEY_PASSWORD 가 없어 서명 없이 컴파일만 확인합니다"
            gradle --no-daemon assembleDebug
            echo "::error::저장소 Settings > Secrets 에 ANDROID_KEY_PASSWORD 를 넣어 주세요"; exit 1
          fi
          if [ ! -f release.keystore.enc ]; then
            # 첫 빌드: 서명 키를 만들고, Secret 비밀번호로 암호화해서 저장소에 보관한다
            keytool -genkeypair -keystore release.keystore -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -alias pcbang -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=PCbang Admin, O=Home, C=KR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in release.keystore -out release.keystore.enc -pass env:ANDROID_KEY_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release.keystore.enc
            git commit -m "안드로이드 서명 키 보관 (암호화)"
            git push
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in release.keystore.enc -out release.keystore -pass env:ANDROID_KEY_PASSWORD
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pcbang-admin.apk
          gh release create "android-${{ github.run_number }}" pcbang-admin.apk \
            --title "PC방 관리 앱 (안드로이드) #${{ github.run_number }}" \
            --notes "핸드폰에서 이 파일을 받아 설치하세요: pcbang-admin.apk" \
            --latest
