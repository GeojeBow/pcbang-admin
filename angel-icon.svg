<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 10 360 250" class="angel-icon">
<style>
  .wl{transform-origin:100px 130px;animation:flapL .55s ease-in-out infinite alternate}
  .wr{transform-origin:200px 130px;animation:flapR .55s ease-in-out infinite alternate}
  @keyframes flapL{from{transform:rotate(12deg)}to{transform:rotate(-10deg)}}
  @keyframes flapR{from{transform:rotate(-12deg)}to{transform:rotate(10deg)}}
  .halo{animation:halo 1.4s ease-in-out infinite alternate}
  @keyframes halo{from{opacity:.75;transform:translateY(2px)}to{opacity:1;transform:translateY(-4px)}}
  .big,.buddy{animation:bob 1.8s ease-in-out infinite alternate}
  .buddy{animation-delay:-.9s}
  @keyframes bob{from{transform:translateY(6px)}to{transform:translateY(-8px)}}
  .shadow{transform-box:fill-box;transform-origin:center;animation:shd 1.8s ease-in-out infinite alternate}
  @keyframes shd{from{transform:scale(1.1)}to{transform:scale(.8);opacity:.45}}
  .mini{animation:floaty 2.2s ease-in-out infinite alternate}
  .m2{animation-delay:-.4s}.m3{animation-delay:-.8s}.m4{animation-delay:-1.2s}.m5{animation-delay:-1.6s}.m6{animation-delay:-.6s}.m7{animation-delay:-1s}.m8{animation-delay:-1.4s}
  @keyframes floaty{from{transform:translate(-6px,6px) rotate(-6deg)}to{transform:translate(6px,-8px) rotate(6deg)}}
  .rays{transform-origin:250px 180px;animation:spin 24s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tw,.hrt{transform-box:fill-box;transform-origin:center;animation:tw 1.1s ease-in-out infinite alternate}
  .hrt{animation-duration:.7s}.h2{animation-delay:-.35s}
  @keyframes tw{from{transform:scale(.55);opacity:.5}to{transform:scale(1.15);opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
