  <linearGradient id="gPrim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f3ecff"/><stop offset="1" stop-color="#ffc6e3"/></linearGradient>
  <linearGradient id="gSec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
